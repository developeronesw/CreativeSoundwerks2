name: Creative Soundwerks CI
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  typecheck-build-and-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csw
          POSTGRES_PASSWORD: cswtest
          POSTGRES_DB: creative_soundwerks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csw -d creative_soundwerks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://csw:cswtest@127.0.0.1:5432/creative_soundwerks
      CSW_SETUP_TOKEN: github-actions-test-token-not-for-production
      PUBLIC_APP_URL: http://localhost:5173
      COOKIE_SECURE: 'false'
      NODE_ENV: test
      STRIPE_WEBHOOK_SECRET: whsec_for_test_only_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate VPS installer syntax
        run: |
          bash -n install.sh
          bash -n scripts/install-ubuntu.sh
          bash -n scripts/build-install-zip.sh
      - run: npm run check
      - run: npm run build
      - name: Ensure FFmpeg and FFprobe are available
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - run: npm run db:migrate
      - name: Boot local API
        run: |
          npm run dev:api >/tmp/csw-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/csw-api.log
          exit 1
      - name: Verify authorization and billing boundary
        run: node --test tests/security.integration.test.mjs
      - name: Build upload-and-extract installer ZIP
        run: bash scripts/build-install-zip.sh
      - name: Verify ZIP can be extracted and preflight checked
        run: |
          mkdir -p /tmp/csw-zip-test
          unzip -q out/creative-soundwerks2-install.zip -d /tmp/csw-zip-test
          cd /tmp/csw-zip-test
          bash install.sh --check
          # Install only from the extracted ZIP, then run a separate API instance.
          # This catches missing runtime dependencies/migrations in the distribution.
          npm ci --no-audit --no-fund
          npm run db:migrate
          HOST=127.0.0.1 PORT=8790 /usr/bin/node apps/api/dist/index.js >/tmp/csw-extracted-api.log 2>&1 &
          zip_api_pid=$!
          trap 'kill "$zip_api_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8790/api/health; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/csw-extracted-api.log
            exit 1
          fi
          test -f apps/web/dist/index.html
          test -f apps/api/dist/index.js
          test -f package-lock.json
          if unzip -Z1 "$GITHUB_WORKSPACE/out/creative-soundwerks2-install.zip" | grep -Eq '(^|/)(node_modules|\.env|\.git|storage)(/|$)'; then
            echo "Unsafe file found in distributable ZIP" >&2
            exit 1
          fi
      - name: Publish installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-soundwerks2-install
          path: out/creative-soundwerks2-install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish result as a commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ job.status }}
        run: |
          if [[ "$CI_RESULT" == "success" ]]; then state="success"; else state="failure"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="creative-soundwerks/full-ci" \
            -f description="Typecheck, build, DB, API and security tests" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
