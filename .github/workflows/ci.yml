name: Creative Soundwerks CI
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  typecheck-build-and-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csw
          POSTGRES_PASSWORD: cswtest
          POSTGRES_DB: creative_soundwerks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csw -d creative_soundwerks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://csw:cswtest@127.0.0.1:5432/creative_soundwerks
      CSW_SETUP_TOKEN: github-actions-test-token-not-for-production
      PUBLIC_APP_URL: http://localhost:5173
      COOKIE_SECURE: 'false'
      NODE_ENV: test
      STRIPE_WEBHOOK_SECRET: whsec_for_test_only_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate VPS installer syntax
        run: |
          bash -n install.sh
          bash -n scripts/install-ubuntu.sh
      - name: Validate independent updater service and launcher
        run: |
          node --check scripts/update-boot.mjs
          node --check scripts/self-updater.mjs
          bash -n scripts/enable-independent-updater.sh
          grep -q 'Restart=on-failure' deploy/creative-soundwerks.service
          grep -q 'CSW_UPDATE_ROOT' deploy/creative-soundwerks-updater.service
          grep -q 'ExecStartPost' deploy/creative-soundwerks-updater.service
      - run: npm run check
      - run: npm run build
      - name: Validate managed panel preparation
        run: |
          node --check scripts/prepare-panel.mjs
          npm run setup:panel:check
      - name: Ensure FFmpeg and FFprobe are available
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - run: npm run db:migrate
      - name: Boot local API
        run: |
          npm run dev:api >/tmp/csw-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/csw-api.log
          exit 1
      - name: Verify authorization and billing boundary
        run: node --test tests/security.integration.test.mjs
      - name: Verify managed hosting without sudo or DevOne Server
        run: |
          PGPASSWORD=cswtest createdb -h 127.0.0.1 -U csw csw_panel_test
          export CSW_CONFIG_PATH="$RUNNER_TEMP/csw-panel.env"
          npm run setup:panel > /tmp/csw-panel-prep.log
          env -u DATABASE_URL PORT=8791 CSW_CONFIG_PATH="$CSW_CONFIG_PATH" node apps/api/dist/index.js >/tmp/csw-panel-api.log 2>&1 &
          panel_pid=$!
          trap 'kill "$panel_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8791/api/setup/status >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/csw-panel-api.log; exit 1; fi
          node tests/panel-install.integration.test.mjs
          kill "$panel_pid" 2>/dev/null || true
          wait "$panel_pid" 2>/dev/null || true
          env -u DATABASE_URL PORT=8791 CSW_CONFIG_PATH="$CSW_CONFIG_PATH" node apps/api/dist/index.js >/tmp/csw-panel-restart.log 2>&1 &
          panel_pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8791/api/setup/status | grep -q '"stage":"complete"'; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/csw-panel-restart.log; exit 1; fi
          echo "Panel mode persists DB and admin state across Node restart"
      - name: Simulate GitHub Download ZIP extraction
        run: |
          git archive --format=zip HEAD -o /tmp/creative-soundwerks2-source.zip
          mkdir -p /tmp/csw-github-download
          unzip -q /tmp/creative-soundwerks2-source.zip -d /tmp/csw-github-download
          cd /tmp/csw-github-download
          bash install.sh --check
          test ! -f apps/web/dist/index.html
          test ! -f apps/api/dist/index.js
          npm install --include=dev --no-audit --no-fund
          npm run check
          npm run build
          npm run db:migrate
          test -f apps/web/dist/index.html
          test -f apps/api/dist/index.js
          HOST=127.0.0.1 PORT=8790 node apps/api/dist/index.js >/tmp/csw-github-api.log 2>&1 &
          source_api_pid=$!
          trap 'kill "$source_api_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8790/api/health; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/csw-github-api.log
            exit 1
          fi
          if unzip -Z1 /tmp/creative-soundwerks2-source.zip | grep -Eq '(^|/)(node_modules|\.env|storage|dist)(/|$)'; then
            echo "GitHub source ZIP has unexpected generated or secret files" >&2
            exit 1
          fi
      - name: Publish result as a commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ job.status }}
        run: |
          if [[ "$CI_RESULT" == "success" ]]; then state="success"; else state="failure"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="creative-soundwerks/full-ci" \
            -f description="Typecheck, build, DB, API and security tests" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
